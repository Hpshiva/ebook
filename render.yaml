# Render blueprint for the backend API. In Render: New → Blueprint → pick this repo.
# The frontend is hosted separately (for example on Vercel) and points at this service.
services:
  - type: web
    name: creator-finder-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL   # paste a PostgreSQL URL (Neon, Supabase or Render Postgres)
        sync: false
      - key: CORS_ORIGINS   # your frontend address, e.g. https://your-app.vercel.app
        sync: false
      - key: APIFY_TOKEN    # optional: only for live Instagram data
        sync: false
